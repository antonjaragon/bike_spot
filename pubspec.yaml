name: bike_spot
description: An offline bike parking notebook for Leuven station.
publish_to: none
version: 1.2.0+3
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  form_field_validator: ^1.1.0
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  timezone: ^0.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true
